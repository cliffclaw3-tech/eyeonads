name: Beta Buddy isolated checks
on:
  push:
    branches: ['feat/beta-buddy-isolation']
    paths: ['services/beta-buddy/**', '.github/workflows/beta-buddy.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  service:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_PASSWORD: disposable-ci-fixture
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r services/beta-buddy/requirements.txt
      - run: python -m unittest discover -s services/beta-buddy -p 'test_*.py' -v
        env:
          BUDDY_TEST_DATABASE_DSN: postgresql://postgres:disposable-ci-fixture@127.0.0.1:5432/postgres
  isolated-proposal:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: docker build --iidfile /tmp/buddy-image-id -f services/beta-buddy/smoke/Dockerfile services/beta-buddy
      - run: python3 services/beta-buddy/smoke/run.py "$(cat /tmp/buddy-image-id)"
